<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roster Manager</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Duty roster planning for 3-shift hospital wards." />
    <meta name="theme-color" content="#2563eb" />
    <!-- SVG where supported; the .ico carries 16/32/48/64 for everything else. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <style>
      @media print {
        @page {
          size: A4 landscape;
          margin: 5mm;
        }

        body {
          background: #fff !important;
          color: #000 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .no-print {
          display: none !important;
        }

        #print-root {
          display: block !important;
          width: 100% !important;
        }

        /* Sticky columns must not float over the printed page. */
        .sticky {
          position: static !important;
        }

        table {
          width: 100% !important;
          table-layout: fixed !important;
          border-collapse: collapse !important;
          font-size: 7px !important;
        }

        th,
        td {
          height: auto !important;
          padding: 2px 1px !important;
          border: 0.5pt solid #cbd5e1 !important;
        }

        /* Roster grid: ink-friendly, high-contrast equivalents of the on-screen chips.
           Class names come from `shift-cell-${code}` in ShiftGrid. */
        .print-header-personnel {
          background-color: #f1f5f9 !important;
          color: #0f172a !important;
          font-weight: 600 !important;
        }

        .print-cell-personnel {
          background-color: #fff !important;
          color: #0f172a !important;
        }

        .print-header-day {
          background-color: #f8fafc !important;
          color: #0f172a !important;
        }

        .shift-cell-1,
        .shift-cell-R1 {
          background-color: #e0f2fe !important;
          color: #0c4a6e !important;
        }

        .shift-cell-1S {
          background-color: #bae6fd !important;
          color: #0c4a6e !important;
        }

        .shift-cell-2,
        .shift-cell-R2 {
          background-color: #ede9fe !important;
          color: #4c1d95 !important;
        }

        .shift-cell-3,
        .shift-cell-R3 {
          background-color: #475569 !important;
          color: #fff !important;
        }

        .shift-cell-W,
        .shift-cell-RW {
          background-color: #fff !important;
          color: #94a3b8 !important;
        }

        .shift-cell-L {
          background-color: #ffe4e6 !important;
          color: #9f1239 !important;
        }

        .shift-cell-H {
          background-color: #fef3c7 !important;
          color: #92400e !important;
        }

        .shift-cell-O1,
        .shift-cell-O2,
        .shift-cell-O3 {
          background-color: #fff !important;
          color: #0f172a !important;
          box-shadow: inset 0 0 0 1pt #64748b !important;
        }

        .shift-cell-- {
          background-color: #fff !important;
          color: #cbd5e1 !important;
        }
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
