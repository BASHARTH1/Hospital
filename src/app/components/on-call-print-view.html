<div class="space-y-4">
  <!-- Header -->
  <div class="no-print flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <button type="button" (click)="back.emit()" class="btn-ghost btn-sm -ml-2 mb-1">
        <app-icon name="ChevronLeft" [size]="14" /> Back to grid
      </button>
      <h1 class="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">On-call list</h1>
      <p class="mt-0.5 text-sm text-slate-500 dark:text-slate-400">
        Department log sheet of every on-call duty, with contact numbers.
      </p>
    </div>
    <button type="button" (click)="print()" [disabled]="rows().length === 0" class="btn-primary">
      <app-icon name="Printer" [size]="15" /> Print {{ rows().length }} day{{ rows().length === 1 ? '' : 's' }}
    </button>
  </div>

  <div class="no-print grid grid-cols-1 gap-4 lg:grid-cols-4">
    <!-- Controls -->
    <div class="space-y-4">
      <div class="card">
        <div class="card-header"><h2 class="card-title">Print options</h2></div>
        <div class="card-body space-y-3">
          <div>
            <label for="oncall-orientation" class="label">Orientation</label>
            <select id="oncall-orientation" (change)="printOrientation.set($any($event.target).value)" class="input input-sm">
              <option value="portrait" [selected]="printOrientation() === 'portrait'">Portrait</option>
              <option value="landscape" [selected]="printOrientation() === 'landscape'">Landscape</option>
            </select>
          </div>
          <div>
            <label for="oncall-theme" class="label">Sheet colour</label>
            <select id="oncall-theme" (change)="printTheme.set($any($event.target).value)" class="input input-sm">
              <option value="slate" [selected]="printTheme() === 'slate'">Classic slate</option>
              <option value="teal" [selected]="printTheme() === 'teal'">Medical teal</option>
              <option value="indigo" [selected]="printTheme() === 'indigo'">Navy</option>
              <option value="amber" [selected]="printTheme() === 'amber'">Amber</option>
              <option value="emerald" [selected]="printTheme() === 'emerald'">Emerald</option>
            </select>
          </div>
          <label class="flex cursor-pointer items-center gap-2 border-t border-slate-100 pt-3 dark:border-slate-800">
            <input type="checkbox" [checked]="hideEmptyDays()"
              (change)="hideEmptyDays.set($any($event.target).checked)" class="checkbox" />
            <span class="text-xs text-slate-600 dark:text-slate-300">Hide days with no on-calls</span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Days</h2>
          <span class="text-xs text-slate-500 dark:text-slate-400">
            {{ selectedDays().length }} / {{ daysInMonth() }}
          </span>
        </div>
        <div class="card-body space-y-3">
          <div class="grid grid-cols-4 gap-1">
            <button type="button" (click)="selectAll()" class="btn-secondary btn-sm px-1">All</button>
            <button type="button" (click)="selectNone()" class="btn-secondary btn-sm px-1">None</button>
            <button type="button" (click)="selectWeekdays()" class="btn-secondary btn-sm px-1">Wkdy</button>
            <button type="button" (click)="selectWeekends()" class="btn-secondary btn-sm px-1">Wknd</button>
          </div>
          <div class="grid grid-cols-7 gap-1">
            @for (d of dayCells(); track d.dayNum) {
              <button
                type="button"
                (click)="toggleDaySelection(d.dayNum)"
                class="h-7 rounded border text-[11px] font-medium transition-colors"
                [class]="
                  isDaySelected(d.dayNum)
                    ? 'border-brand-500 bg-brand-600 text-white'
                    : d.isWeekend
                      ? 'border-slate-200 bg-amber-50 text-amber-700 hover:bg-amber-100 dark:border-slate-700 dark:bg-amber-500/10 dark:text-amber-400'
                      : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800'
                "
                [attr.aria-pressed]="isDaySelected(d.dayNum)"
              >
                {{ d.dayNum }}
              </button>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="lg:col-span-3">
      <div class="card overflow-x-auto p-6">
        <div class="min-w-[620px]">
          <app-on-call-table [config]="config()" [rows]="rows()" [themeStyles]="themeStyles()" [printedOn]="printedOn" />
        </div>
      </div>
    </div>
  </div>

  <!-- Print-only output -->
  <div class="hidden print-oncall-container w-full bg-white p-0 text-black">
    <app-on-call-table [config]="config()" [rows]="rows()" [themeStyles]="themeStyles()" [printedOn]="printedOn" />
  </div>
</div>
