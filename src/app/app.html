<div class="min-h-screen bg-slate-50 dark:bg-slate-950 print:bg-white">
  <!-- Application bar: identity, current period, theme, and the section tabs -->
  <header
    class="no-print sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur
      dark:border-slate-800 dark:bg-slate-900/90"
  >
    <div class="mx-auto flex h-14 max-w-[1800px] items-center gap-3 px-4 sm:px-6">
      <div class="flex items-center gap-2.5">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-md bg-brand-600 text-white shadow-sm"
          aria-hidden="true"
        >
          <app-icon name="Activity" [size]="18" />
        </span>
        <span class="text-sm font-semibold tracking-tight text-slate-900 dark:text-slate-100">
          Roster Manager
        </span>
      </div>

      <span class="hidden h-5 w-px bg-slate-200 dark:bg-slate-700 sm:block" aria-hidden="true"></span>

      <p class="hidden truncate text-sm text-slate-500 dark:text-slate-400 sm:block">
        {{ contextLabel() }}
      </p>

      <div class="ml-auto flex items-center gap-1">
        <button
          type="button"
          (click)="toggleTheme()"
          class="btn-icon"
          [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
          [title]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        >
          <app-icon [name]="isDark() ? 'Sun' : 'Moon'" [size]="18" />
        </button>
      </div>
    </div>

    <nav class="mx-auto max-w-[1800px] px-4 sm:px-6" aria-label="Sections">
      <div class="-mb-px flex gap-1 overflow-x-auto">
        @for (tab of tabs; track tab.id) {
          <button
            type="button"
            (click)="store.setActiveTab(tab.id)"
            class="flex items-center gap-2 whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium transition-colors"
            [class]="
              store.activeTab() === tab.id
                ? 'border-brand-600 text-brand-700 dark:border-brand-500 dark:text-brand-400'
                : 'border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-800 dark:text-slate-400 dark:hover:border-slate-700 dark:hover:text-slate-200'
            "
            [attr.aria-current]="store.activeTab() === tab.id ? 'page' : null"
          >
            <app-icon [name]="tab.icon" [size]="16" />
            {{ tab.label }}
          </button>
        }
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-[1800px] px-4 py-6 sm:px-6 print:max-w-none print:p-0">
    @switch (store.activeTab()) {
      @case ('Staff') {
        <app-staff-manager
          [staff]="store.staff()"
          [config]="store.config()"
          (add)="store.addStaff()"
          (addHa)="store.addHaStaff()"
          (addCounterPart)="store.addCounterPartStaff()"
          (updateMember)="store.updateStaff($event.id, $event.updates)"
          (removeMultiple)="store.removeMultipleStaff($event)"
          (exportCsv)="store.exportStaff()"
          (importCsv)="store.importStaff($event)"
        />
      }
      @case ('Rules') {
        <app-rules-manager
          [config]="store.config()"
          [staff]="store.staff()"
          [assignments]="store.resolvedAssignments()"
          (configChange)="store.setConfig($event)"
        />
      }
      @case ('Manual') {
        <app-manual-entry
          [staff]="store.staff()"
          [config]="store.config()"
          [assignments]="store.resolvedAssignments()"
          (updateAssignment)="store.updateAssignment($event.staffId, $event.date, $event.shift)"
          (updateBatch)="store.updateAssignmentsBatch($event)"
          (exportCsv)="store.exportAssignments()"
          (importCsv)="store.importAssignments($event)"
        />
      }
      @case ('Generate') {
        <app-generator
          [staff]="store.staff()"
          [config]="store.config()"
          [assignments]="store.assignments()"
          (generated)="store.setAssignments($event)"
          (completed)="store.setActiveTab('Calendar')"
        />
      }
      @case ('Calendar') {
        <app-calendar-view
          [staff]="store.staff()"
          [config]="store.config()"
          [assignments]="store.resolvedAssignments()"
          (exportCsv)="store.exportAssignments()"
          (configChange)="store.setConfig($event)"
        />
      }
    }
  </main>
</div>
